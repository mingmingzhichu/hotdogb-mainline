name: build

on:
  workflow_dispatch:
    inputs:
      kernel_tarball:
        description: Kernel source archive (GitLab/GitHub archive URL)
        required: false
        default: https://gitlab.postmarketos.org/soc/qualcomm-sm8150/linux/-/archive/8e126dbc4044ef2cec3ebe5754ddb05faa554af6/linux-8e126dbc4044ef2cec3ebe5754ddb05faa554af6.tar.gz

env:
  KERNEL_TARBALL: ${{ inputs.kernel_tarball || 'https://gitlab.postmarketos.org/soc/qualcomm-sm8150/linux/-/archive/8e126dbc4044ef2cec3ebe5754ddb05faa554af6/linux-8e126dbc4044ef2cec3ebe5754ddb05faa554af6.tar.gz' }}
  CROSS: aarch64-linux-gnu-
  CMDS: "clk_ignore_unused loglevel=7 panic=0 printk.time=1 ramoops.max_reason=5 log_buf_len=4M"
  RELEASE_TAG: ci-latest

permissions:
  contents: write

jobs:
  clean:
    name: clean the previous release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          git push origin ":refs/tags/$RELEASE_TAG" 2>/dev/null || true

  kernel:
    name: kernel + dtb + modules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross kmod \
            device-tree-compiler python3 cpio curl wget bzip2 patch

      - name: Fetch the pinned kernel tree
        run: |
          curl -fL --retry 3 --retry-delay 5 -o linux.tar.gz "$KERNEL_TARBALL"
          tar xzf linux.tar.gz
          dir=$(tar tzf linux.tar.gz | head -1 | cut -d/ -f1)
          mv "$dir" linux
          head -5 linux/Makefile

      - name: Apply the patches
        run: |
          set -x
          cd linux
          for p in ../patches/*.patch; do
            echo "=== $p ==="
            patch -p1 --batch --forward --no-backup-if-mismatch < "$p" || {
              echo "FAILED to apply $p"
              exit 1
            }
          done
          grep -c sofef03f drivers/gpu/drm/panel/Makefile

      - name: Configure
        run: |
          cd linux
          cp ../configs/hotdogb_defconfig arch/arm64/configs/hotdogb_defconfig
          make ARCH=arm64 CROSS_COMPILE=$CROSS hotdogb_defconfig
          scripts/kconfig/merge_config.sh -m .config \
            ../configs/hotdogb-display-touch.config \
            ../configs/hotdogb-audio.config \
            ../configs/hotdogb-netboot.config
          make ARCH=arm64 CROSS_COMPILE=$CROSS olddefconfig
          grep -E '^CONFIG_(DRM_PANEL_SAMSUNG_SOFEF03F|DRM_MSM|DRM_KMS_HELPER|INPUT_EVDEV|KEYBOARD_GPIO|SND_SOC_SM8150|SND_SOC_QDSP6|SND_SOC_WCD934X|MFD_WCD934X|SLIM_QCOM_NGD_CTRL|BLK_DEV_NBD|USB_DWC3|USB_DWC3_QCOM|PHY_QCOM_QMP_USB|USB_CONFIGFS|USB_F_NCM|SCSI_UFS_QCOM)=' .config
          # The initramfs ships no modules, so the netboot path has to be
          # built in.  Fail the build instead of producing a dead image.
          for s in BLK_DEV_NBD USB_DWC3 USB_DWC3_QCOM PHY_QCOM_QMP_USB USB_CONFIGFS USB_F_NCM USB_GADGET; do
            grep -q "^CONFIG_$s=y$" .config || { echo "CONFIG_$s is not built in"; exit 1; }
          done

      - name: Build the kernel, the DTB and the modules
        run: |
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=$CROSS \
            Image qcom/sm8150-oneplus-hotdogb.dtb modules

      - name: Install the modules
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=$CROSS \
            INSTALL_MOD_PATH="$PWD/../out/modules" INSTALL_MOD_STRIP=1 \
            modules_install
          tar czf ../out/modules.tar.gz -C ../out modules
          echo "modules: $(find ../out/modules -name '*.ko' | wc -l)"

      - name: Collect the kernel artifacts
        run: |
          mkdir -p out
          cp linux/arch/arm64/boot/Image out/Image
          cp linux/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb out/
          cp linux/.config out/config
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out/
          if-no-files-found: error

  busybox:
    name: static aarch64 busybox
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the Debian package
        run: |
          base=https://deb.debian.org/debian/pool/main/b/busybox
          deb=$(curl -s "$base/" |
            grep -o 'busybox-static_[0-9][^"]*_arm64\.deb' |
            sort -V | tail -1)
          echo "using $deb"
          curl -fL -o busybox.deb "$base/$deb"
          dpkg-deb -x busybox.deb busybox-static-arm64
          find busybox-static-arm64 -type f -name busybox -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: busybox
          path: busybox-static-arm64/
          if-no-files-found: error

  rootfs:
    name: Debian netboot rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install the rootfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support xz-utils

      - name: Build the Debian arm64 rootfs
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          mkdir -p out
          sudo sh tools/build_debian_rootfs.sh /tmp/debroot out/netboot-debian.img 6G
          xz -T0 -6 out/netboot-debian.img

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: out/netboot-debian.img.xz
          if-no-files-found: error

  busybox-pack:
    name: pack the boot images
    runs-on: ubuntu-24.04
    needs: [kernel, busybox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: kernel-out

      - uses: actions/download-artifact@v4
        with:
          name: busybox
          path: busybox

      - name: Build the initramfs and pack the images
        run: |
          mkdir -p out
          cp kernel-out/Image out/Image
          cp kernel-out/sm8150-oneplus-hotdogb.dtb out/
          cp kernel-out/config out/config
          BB=$(find busybox -type f -name busybox | head -1)
          # download-artifact does not preserve the executable bit
          chmod +x "$BB"
          sh tools/build_initramfs.sh "$BB" out/initramfs.cpio.gz
          python3 tools/patch_image_header.py --image out/Image --output out/Image.patched
          python3 tools/mkbootimg_v2.py \
            --kernel out/Image.patched \
            --ramdisk out/initramfs.cpio.gz \
            --dtb out/sm8150-oneplus-hotdogb.dtb \
            --cmdline "$CMDS" \
            --output out/boot-hotdogb.img
          python3 tools/mkbootimg_v2.py \
            --kernel out/Image.patched \
            --ramdisk out/initramfs.cpio.gz \
            --dtb out/sm8150-oneplus-hotdogb.dtb \
            --cmdline "$CMDS hotdogb.netboot=1 hotdogb.netboot.host=172.16.42.2" \
            --output out/boot-hotdogb-netboot.img
          find out -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            xargs -0 sha256sum | tee out/SHA256SUMS
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: out/
          if-no-files-found: error

  release:
    name: publish the release
    runs-on: ubuntu-24.04
    needs: [clean, busybox-pack, rootfs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot-out

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: rootfs-out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "hotdogb CI build" \
            --notes "Built from ${{ github.sha }}" \
            --prerelease
          for f in boot-out/* rootfs-out/*; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 2000000000 ]; then
              echo "skipping $f (over the 2 GiB asset limit)"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'

  checkpatch:
    name: checkpatch
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install checkpatch dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends perl curl

      - name: Fetch the pinned kernel tree
        run: |
          curl -fL --retry 3 -o linux.tar.gz "$KERNEL_TARBALL"
          tar xzf linux.tar.gz
          dir=$(tar tzf linux.tar.gz | head -1 | cut -d/ -f1)
          mv "$dir" linux

      - name: Run checkpatch
        run: |
          cd linux
          for p in ../patches/*.patch; do
            echo "=== $p ==="
            ./scripts/checkpatch.pl --no-tree --strict --patch "$p" || true
          done

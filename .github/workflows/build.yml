name: build

on:
  workflow_dispatch:
    inputs:
      kernel_tarball:
        description: Kernel source archive (.tar.xz or .tar.gz URL)
        required: false
        default: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.3.tar.xz

env:
  KERNEL_TARBALL: ${{ inputs.kernel_tarball || 'https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.3.tar.xz' }}
  CROSS: aarch64-linux-gnu-
  CMDS: "clk_ignore_unused loglevel=7 panic=0 printk.time=1 ramoops.max_reason=5 log_buf_len=4M"
  PREVIOUS_RELEASE_TAG: ci-latest

permissions:
  contents: write

jobs:
  clean:
    name: clean previous release assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete previous release asset files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_exists=$(gh release list --limit 100 --json tagName \
            --jq 'any(.[]; .tagName == "ci-latest")')
          if [ "$release_exists" = "true" ]; then
            assets=$(gh release view "$PREVIOUS_RELEASE_TAG" \
              --json assets --jq '.assets[].name')
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$PREVIOUS_RELEASE_TAG" "$asset" --yes
            done <<< "$assets"
          else
            echo "No previous $PREVIOUS_RELEASE_TAG release; skipping asset cleanup"
          fi

  kernel:
    name: kernel + dtb + modules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross kmod \
            device-tree-compiler python3 cpio curl wget bzip2 patch

      - name: Fetch the pinned kernel tree
        run: |
          curl -fL --retry 3 --retry-delay 5 -o linux.tar.xz "$KERNEL_TARBALL"
          tar xf linux.tar.xz
          dir=$(tar tf linux.tar.xz | head -1 | cut -d/ -f1)
          mv "$dir" linux
          head -5 linux/Makefile

      - name: Apply the patches
        run: |
          set -x
          cd linux
          for p in ../patches/*.patch; do
            echo "=== $p ==="
            patch -p1 --batch --forward --no-backup-if-mismatch < "$p" || {
              echo "FAILED to apply $p"
              exit 1
            }
          done
          grep -c sofef03f drivers/gpu/drm/panel/Makefile

      - name: Configure
        run: |
          cd linux
          cp ../configs/hotdogb_defconfig arch/arm64/configs/hotdogb_defconfig
          make ARCH=arm64 CROSS_COMPILE=$CROSS hotdogb_defconfig
          scripts/kconfig/merge_config.sh -m .config \
            ../configs/hotdogb-display-touch.config \
            ../configs/hotdogb-audio.config \
            ../configs/hotdogb-netboot.config
          make ARCH=arm64 CROSS_COMPILE=$CROSS olddefconfig
          grep -E '^CONFIG_(DRM_PANEL_SAMSUNG_SOFEF03F|DRM_MSM|DRM_KMS_HELPER|INPUT_EVDEV|KEYBOARD_GPIO|SND_SOC_SM8150|SND_SOC_QDSP6|SND_SOC_WCD934X|MFD_WCD934X|SLIM_QCOM_NGD_CTRL|BLK_DEV_NBD|USB_DWC3|USB_DWC3_QCOM|PHY_QCOM_QMP_USB|USB_CONFIGFS|USB_F_NCM|SCSI_UFS_QCOM)=' .config
          # The initramfs ships no modules, so the netboot path has to be
          # built in.  Fail the build instead of producing a dead image.
          for s in BLK_DEV_NBD USB_DWC3 USB_DWC3_QCOM PHY_QCOM_QMP_USB USB_CONFIGFS USB_F_NCM USB_GADGET; do
            grep -q "^CONFIG_$s=y$" .config || { echo "CONFIG_$s is not built in"; exit 1; }
          done

      - name: Build the kernel, the DTB and the modules
        run: |
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=$CROSS \
            Image qcom/sm8150-oneplus-hotdogb.dtb modules

      - name: Install the modules
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=$CROSS \
            INSTALL_MOD_PATH="$PWD/../out/modules" INSTALL_MOD_STRIP=1 \
            modules_install
          tar czf ../out/modules.tar.gz -C ../out modules
          echo "modules: $(find ../out/modules -name '*.ko' | wc -l)"

      - name: Collect the kernel artifacts
        run: |
          mkdir -p out
          cp linux/arch/arm64/boot/Image out/Image
          cp linux/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb out/
          cp linux/.config out/config
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out/
          if-no-files-found: error

  busybox:
    name: static aarch64 busybox
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the Debian package
        run: |
          base=https://deb.debian.org/debian/pool/main/b/busybox
          deb=$(curl -s "$base/" |
            grep -o 'busybox-static_[0-9][^"]*_arm64\.deb' |
            sort -V | tail -1)
          echo "using $deb"
          curl -fL -o busybox.deb "$base/$deb"
          dpkg-deb -x busybox.deb busybox-static-arm64
          find busybox-static-arm64 -type f -name busybox -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: busybox
          path: busybox-static-arm64/
          if-no-files-found: error

  userspace-tools:
    name: cross-build radio + sensor userspace helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build pd-mapper/rmtfs/tqftpserv, libssc and SSC iio-sensor-proxy
        run: bash tools/build-userspace.sh

      - uses: actions/upload-artifact@v4
        with:
          name: userspace-tools
          path: out/userspace-tools.tar.gz
          if-no-files-found: error

  rootfs-base:
    name: Build Debian netboot rootfs base
    runs-on: ubuntu-24.04
    needs: [userspace-tools]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: userspace-tools
          path: userspace-tools

      - name: Install the rootfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support xz-utils

      - name: Build and stage the Debian arm64 rootfs
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          mkdir -p userspace-tools-unpacked out
          tar xzf userspace-tools/userspace-tools.tar.gz -C userspace-tools-unpacked
          sudo env USERSPACE_TOOLS="$PWD/userspace-tools-unpacked" \
            sh tools/build_debian_rootfs.sh /tmp/debroot out/netboot-debian.img 6G
          xz -T0 -0 out/netboot-debian.img

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-base
          path: out/netboot-debian.img.xz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  rootfs:
    name: Integrate kernel modules into rootfs
    runs-on: ubuntu-24.04
    needs: [kernel, rootfs-base]
    timeout-minutes: 240
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: kernel-out

      - uses: actions/download-artifact@v4
        with:
          name: rootfs-base
          path: rootfs-base

      - name: Install the rootfs integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kmod xz-utils binutils

      - name: Add kernel modules and verify the rootfs
        run: |
          mkdir -p out
          unxz rootfs-base/netboot-debian.img.xz
          mv rootfs-base/netboot-debian.img out/
          # The netboot image has to carry the matching kernel modules: the
          # panel, touchscreen, amplifier and sound card drivers are modules.
          sudo mkdir -p /mnt/hotdogb-root
          sudo mount -o loop out/netboot-debian.img /mnt/hotdogb-root
          sudo mkdir -p /mnt/hotdogb-root/lib/modules
          sudo tar xzf kernel-out/modules.tar.gz -C /mnt/hotdogb-root/lib/modules --strip-components=3
          # The ath10k modules from the kernel build make the WCN3990 drop the
          # SoC into EDL (verified 2026-11-27).  Replace them with the exact
          # set verified on the handset; hotdogb-radio.sh wifi insmods these
          # in order rather than calling modprobe.
          KVER=$(ls /mnt/hotdogb-root/lib/modules)
          ATHDIR="/mnt/hotdogb-root/lib/modules/$KVER/kernel/drivers/net/wireless/ath"
          sudo cp firmware/wifi-modules/*.ko "$ATHDIR/"
          sudo cp firmware/wifi-modules/ath10k/*.ko "$ATHDIR/ath10k/"
          sudo depmod -b /mnt/hotdogb-root "$KVER"
          sudo test -f "/mnt/hotdogb-root/lib/modules/$KVER/modules.dep"
          # The desktop stack is easy to lose to a typo in the package list;
          # fail here instead of shipping an image without an OSK or input
          # method.
          for f in usr/bin/phosh-mobile-settings usr/bin/squeekboard \
                   usr/bin/ibus-daemon usr/bin/gsettings \
                   usr/lib/firmware/ath10k/WCN3990/hw1.0/board-2.bin \
                   usr/lib/firmware/ath10k/WCN3990/hw1.0/firmware-5.bin \
                   usr/lib/firmware/ath10k/WCN3990/hw1.0/wlanmdsp.mbn \
                   usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so \
                   usr/lib/firmware/qcom/a630_sqe.fw \
                   usr/lib/firmware/qcom/a640_gmu.bin \
                   usr/lib/firmware/qcom/sm8150/a640_zap.mbn \
                   usr/lib/firmware/qcom/sm8150/oneplus7/modem.mbn \
                   usr/local/sbin/hotdogb-radio.sh \
                   usr/local/sbin/hotdogb-gps-setup \
                   usr/local/sbin/pd-mapper \
                   usr/local/sbin/qrtr-lookup \
                   usr/local/sbin/hexagonrpcd \
                   usr/local/sbin/hotdogb-sensors.sh \
                   etc/systemd/system/hotdogb-sensors.service \
                   usr/bin/iio-sensor-proxy \
                   usr/bin/gnss-share \
                   etc/gnss-share.conf \
                   etc/modprobe.d/hotdogb-ath10k.conf; do
            sudo test -e "/mnt/hotdogb-root/$f" || { echo "missing /$f"; exit 1; }
          done
          # The baked radio data is what lets MPSS publish WLFW: without the
          # tqftpserv readwrite files or the EFS images ath10k waits forever.
          for f in var/lib/tqftpserv/wlan_mac.bin \
                   var/lib/tqftpserv/bdwlan.bin \
                   var/lib/hotdogb/rmtfs/modem_fs1 \
                   var/lib/hotdogb/rmtfs/modem_fs2 \
                   var/lib/hotdogb/rmtfs/modem_fsg \
                   var/lib/hotdogb/rmtfs/modem_fsc; do
            sudo test -e "/mnt/hotdogb-root/$f" || { echo "missing /$f"; exit 1; }
          done
          # The SSC sensor stack must ship its udev rules and libssc driver.
          sudo find /mnt/hotdogb-root/usr/lib -name 'libssc*.so*' | grep -q . || {
            echo "missing libssc"; exit 1; }
          sudo find /mnt/hotdogb-root/usr/lib/udev/rules.d -name '*ssc*.rules' | grep -q . || {
            echo "missing SSC udev rules"; exit 1; }
          # Existence is not enough: the cross-built helpers link against arm64
          # libraries that only the CI build container had.  A missing soname
          # (libprotobuf-c.so.1 for libssc) only shows up when the daemon starts,
          # so resolve every NEEDED entry against the image here.
          for f in usr/bin/iio-sensor-proxy usr/lib/aarch64-linux-gnu/libssc.so.1 \
                   usr/local/sbin/pd-mapper usr/local/sbin/hexagonrpcd; do
            for lib in $(readelf -d "/mnt/hotdogb-root/$f" |
                         sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
              sudo find /mnt/hotdogb-root/usr/lib /mnt/hotdogb-root/lib -name "$lib" |
                grep -q . || { echo "missing runtime library $lib (needed by /$f)"; exit 1; }
            done
          done
          sudo test -f /mnt/hotdogb-root/etc/locale.conf
          sudo test -f /mnt/hotdogb-root/etc/xdg/autostart/ibus-daemon.desktop
          sudo grep -q '^mmzc:' /mnt/hotdogb-root/etc/passwd
          sudo find /mnt/hotdogb-root/usr/share/fonts -name 'NotoSansCJK*' | grep -q .
          sudo umount /mnt/hotdogb-root
          xz -T0 -6 out/netboot-debian.img

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: out/netboot-debian.img.xz
          if-no-files-found: error

  busybox-pack:
    name: pack the boot images
    runs-on: ubuntu-24.04
    needs: [kernel, busybox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: kernel-out

      - uses: actions/download-artifact@v4
        with:
          name: busybox
          path: busybox

      - name: Build the initramfs and pack the images
        run: |
          mkdir -p out
          cp kernel-out/Image out/Image
          cp kernel-out/sm8150-oneplus-hotdogb.dtb out/
          cp kernel-out/config out/config
          BB=$(find busybox -type f -name busybox | head -1)
          # download-artifact does not preserve the executable bit
          chmod +x "$BB"
          sh tools/build_initramfs.sh "$BB" out/initramfs.cpio.gz
          python3 tools/patch_image_header.py --image out/Image --output out/Image.patched
          python3 tools/mkbootimg_v2.py \
            --kernel out/Image.patched \
            --ramdisk out/initramfs.cpio.gz \
            --dtb out/sm8150-oneplus-hotdogb.dtb \
            --cmdline "$CMDS" \
            --output out/boot-hotdogb.img
          python3 tools/mkbootimg_v2.py \
            --kernel out/Image.patched \
            --ramdisk out/initramfs.cpio.gz \
            --dtb out/sm8150-oneplus-hotdogb.dtb \
            --cmdline "$CMDS hotdogb.netboot=1 hotdogb.netboot.host=172.16.42.2" \
            --output out/boot-hotdogb-netboot.img
          find out -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            xargs -0 sha256sum | tee out/SHA256SUMS
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: out/
          if-no-files-found: error

  release:
    name: publish the release
    runs-on: ubuntu-24.04
    needs: [clean, kernel, busybox-pack, rootfs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: kernel-out

      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot-out

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: rootfs-out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DATE=$(date -u +%F)
          RELEASE_TAG="ci-${RELEASE_DATE}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" \
            --title "hotdogb CI build $RELEASE_DATE" \
            --notes "Built from ${{ github.sha }}" \
            --prerelease
          for f in boot-out/* rootfs-out/* kernel-out/modules.tar.gz; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 2000000000 ]; then
              echo "skipping $f (over the 2 GiB asset limit)"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'

  checkpatch:
    name: checkpatch
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install checkpatch dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends perl curl

      - name: Fetch the pinned kernel tree
        run: |
          curl -fL --retry 3 -o linux.tar.xz "$KERNEL_TARBALL"
          tar xf linux.tar.xz
          dir=$(tar tf linux.tar.xz | head -1 | cut -d/ -f1)
          mv "$dir" linux

      - name: Run checkpatch
        run: |
          cd linux
          for p in ../patches/*.patch; do
            echo "=== $p ==="
            ./scripts/checkpatch.pl --no-tree --strict --patch "$p" || true
          done
